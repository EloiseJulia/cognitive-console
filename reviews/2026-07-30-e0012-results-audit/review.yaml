transfer_conclusion_credibility:
  answer: CREDIBLE_WITH_CAVEAT
  explanation: |
    YES — the TRANSFER conclusion is scientifically credible and can be written into the paper,
    BUT the framing requires one correction:

    WHAT IS TRUE AND VERIFIABLE:
    - The calibration button (3 non-trained families, 105 combos) achieves behavioral improvement
      over unsteered baseline: 13/105 combos pass δ=0.05 DEV cutoff — button CAN produce
      meaningful calibration improvement (supports TRANSFER tier, not READ-only or VERIFIED-CONTROL).
    - The button's best DEV behavioral score (0.704 at k=3, BTN-CAL-PROBE layer=19 α=24) is
      substantially below the best strong calibration prompt score (0.8270 at k=5) — gap=0.1230.
    - The button does NOT beat a strong calibration prompt comparator under the frozen kill rule.
    - Stage 1 (TEST adjudication on fresh pool) was correctly NOT run (kill rule precedes TEST).
    - All §9 safety guards were in place; no proxy fallback; real (confidence, correctness) pairs.

    WHAT NEEDS CAVEAT:
    - The "auto-optimized prompt" comparator was implemented as the best of 50 pre-authored
      human-expert calibration prompts (shuffled by seed=42), NOT as model-generated prompts
      from the frozen meta-prompt (§5-B). This is a protocol deviation.
    - If model-generated prompts score 12+ pp worse than pre-authored ones, the kill rule
      might not have fired. This cannot be ruled out without running real APE.

    FOR PAPER USE:
    TRANSFER supports the READ/TRANSFER/VERIFIED taxonomy boundary empirically:
    "The calibration button produces behavioral improvement (TRANSFER tier confirmed),
    but does not achieve VERIFIED-CONTROL — it is beaten by a strong prompt baseline,
    with the button's best DEV 1−Brier (0.704) well below the prompt comparator (0.827)."
    This is the honest, scientifically defensible version. The paper should describe the
    comparator as "strong pre-authored calibration prompts" rather than "LLM-auto-generated."
    The taxonomy boundary evidence IS real and meaningful.
