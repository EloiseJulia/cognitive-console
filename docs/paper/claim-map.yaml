claims:
  C1:
    statement: "Representational legibility/facade gap with restricted invariance: in this two-model pair, deliberation and skepticism show facade support in both models, while uncertainty and focus are model-dependent."
    status: "partially-supported; exploratory two-model support at the 3/4 aggregate level, with per-axis heterogeneity"
    supporting_evidence_ids: ["E-0003", "E-0008"]
    scope: "Qwen2.5-7B-Instruct and Llama-3-8B-Instruct; deliberation and skepticism hold in both; uncertainty is model-dependent (Qwen 0.713 hold vs Llama 1.000 no-facade); focus is model-dependent (Llama 0.471 hold vs Qwen 2.844 overshoot/no-facade)"
    paper_sections: ["Abstract", "Introduction", "Methods", "Results", "Limitations", "Conclusion"]
    main_artifacts: ["fig2-read-facade.pdf", "table-c1-twomodel"]
    valid_for_paper: "false for confirmatory/core claim per evidence ledger; usable only if explicitly labeled exploratory/scoped"
    gate_notes: "E-0003 and E-0008 both have valid_for_paper=false for confirmatory use. Mark exploratory everywhere; say aggregate support replicates but axis composition does not."
  C2:
    statement: "Legibility does not transfer to behavioral controllability for naive/bounded CAA/ITI steering: across CAA/ITI x Qwen2.5-7B/Llama-3-8B, steering shows no demonstrated superiority over the bounded best-prompt baseline on any tested axis under the pre-registered pass rule (failed-superiority, not a latent PASS). The original uncertainty grid remains four steer-vs-bounded-prompt negative contrasts under the frozen scorer as run, with E-0013 limited to the narrow CAA×Qwen format/missingness recheck. Experiment A adds audited, pre-registered powered refinement: CAA deliberation for Qwen and Llama is equivalent within ±0.05, Qwen·CAA skepticism is equivalent within ±0.05 but bounded because MDE=0.053>δ, and Qwen·CAA uncertainty is a fully powered comparator-negative contrast. This refines resolution for those CAA cells only; it does not alter the frozen 0/12 headline or establish any latent PASS."
    status: "supported as a pre-registered negative generalized across tested methods and models; split sensitivity is consistent across four prospectively frozen new split seeds plus the previously observed frozen seed over the same shared item pool (E-0011); Experiment A provides audited powered CAA-cell refinement without changing the headline 0/12 pass grid"
    supporting_evidence_ids: ["E-0005", "E-0006", "E-0009", "E-0011", "E-0013", "E-0014", "E-0015", "E-POWERED-TOST-A"]
    scope: "Frozen C2b adjudicator; core headline is {CAA, ITI} x {Qwen2.5-7B, Llama-3-8B}; axes deliberation, skepticism, uncertainty_awareness; bounded prompt effort; naive/off-the-shelf steering under the frozen method-specific single-layer additive convention h'=h+alpha*s_m*u_m, with s_CAA=1, s_ITI=sigma_L, and coefficient alpha<=24 (not a common injected-norm bound). E-0009 is exploratory method-strength context. E-0011 measures split sensitivity over the same shared item pool: four new split seeds were prospectively frozen after the original frozen seed had been observed. E-0013 is valid only for the CAA×Qwen format-robustness/limitation claim; three cells remain unverified. E-POWERED-TOST-A is an additive powered refinement for selected CAA cells only: deliberation Qwen+Llama, skepticism Qwen (bounded, MDE0.053>δ), and uncertainty Qwen comparator-negative; ITI cells and other model-axis cells remain frozen/original-scope, with no latent PASS and 0/12 unchanged. E-0014 and E-0015 are valid only as positive-control and assay-sensitivity limitations, not as positive latent-control evidence or universal negatives."
    paper_sections: ["Abstract", "Introduction", "Methods", "Results", "Limitations", "Conclusion"]
    main_artifacts: ["table-c2-delta-4cell", "fig3-uncertainty.pdf"]
    valid_for_paper: true
    exploratory_supporting_evidence_ids: ["E-0009"]
    core_evidence_ids: ["E-0005", "E-0006", "E-0011"]
    refinement_evidence_ids: ["E-POWERED-TOST-A"]
    scoped_limitation_evidence_ids: ["E-0013", "E-0014", "E-0015"]
    excluded_diagnostic_ids: ["E-0015-logit-diagnostic"]
    gate_notes: "Passes Abstract/Contributions/Conclusion evidence gate via E-0005/E-0006 and the E-0011 split-seed robustness companion. E-POWERED-TOST-A is folded as scoped resolution/powered refinement only: CAA deliberation two-model equivalence, Qwen·CAA skepticism bounded equivalence, and Qwen·CAA uncertainty comparator-negative; it does not alter the frozen 0/12 headline, does not power ITI/other-model cells, and is not a latent PASS. E-0013 supports only D-0078's CAA×Qwen format-robustness statement, including post-generation conditioning and missingness caveats; ITI×Qwen and both Llama cells were not rechecked. E-0014 supports endpoint-live plus bounded unit-direction CAA null limitation wording and is not a passing latent positive control. E-0015 supports a scale-corrected CAA coherent-null/assay-sensitivity limitation with ceiling and MDE caveats, not a universal/core latent negative. E-0015-logit-diagnostic is valid_for_paper=false, appendix-only, and supports no claim. Scope guard: bounded prompt vs naive/off-the-shelf CAA/ITI under method-specific scaling; 2 models × 2 methods; not an impossibility theorem."
  B1:
    statement: "The qualification adjudicator is mechanically satisfiable and discriminative under a simple prompt-level positive control: it accepts the exactly-two-words prompt effect (Δ=0.6000, CI[0.4453,0.7509]) and rejects a noisy strong-vs-strong-prime null (Δ=0.0113, CI[-0.0302,0.0528])."
    status: "supported positive-control diagnostic; valid_for_paper=true for decision-rule behavior only"
    supporting_evidence_ids: ["E-B1-PC-20260813"]
    scope: "Decision-rule behavior only. This is a prompt/instruction positive-control diagnostic for adjudicator satisfiability and discrimination; it is additive to the frozen C2 0/12 grid and does not overwrite E-0005/E-0006/E-0011. It is explicitly NOT latent-steering efficacy evidence."
    paper_sections: ["Methods", "Results", "Limitations"]
    main_artifacts: []
    evidence_artifacts:
      - "results/noisy_pc_20260813/noisy_pc_result.json"
      - "results/strong_negative_pc_20260813/strong_negative_pc_result.json"
      - "results/strong_negative_pc_20260813/raw_generations.jsonl"
      - "docs/ledgers/evidence-ledger.md#E-B1-PC-20260813"
    valid_for_paper: true
    gate_notes: "B1 supports only the paper's qualification-rule sanity check: satisfiable + discriminative adjudication. pc3 raw decoded generations are unavailable and honestly recorded; metrics remain independently recomputable from committed arrays under the trivial token_count==2 scorer. Do not cite B1 as a latent-control or steering success."

  C2-mech:
    statement: "The steer-vs-bounded-prompt negative contrast under the frozen scorer (as run; all-generation sign unidentified in the one rechecked Qwen/CAA cell) might be explained by off-manifold steering distance; direct Qwen/CAA steer-vs-baseline is near zero (+0.011 compliance, +0.0008 1-Brier)."
    status: "hypothesis/future work only; directly tested and not supported"
    supporting_evidence_ids: ["E-0007"]
    scope: "Whitened Mahalanobis OOD distance vs the per-item steer-vs-bounded-prompt calibration contrast, uncertainty axis, four CAA/ITI x Qwen/Llama cells"
    paper_sections: ["Results", "Limitations", "Future Work"]
    main_artifacts: []
    valid_for_paper: "future-work/null-result context only; not a contribution"
    gate_notes: "E-0007 is a valid null, not support for the mechanism. Do not enter Abstract/Contributions/Conclusion as a positive claim."
  C2a:
    statement: "Internal-state non-surjectivity: steered residual activations may be unreachable by bounded prompts."
    status: "background/motivation only"
    supporting_evidence_ids: []
    scope: "Mishra et al. theory/background; not empirically tested by this project"
    paper_sections: ["Introduction", "Related Work"]
    main_artifacts: []
    valid_for_paper: "background citation only; not our empirical claim"
    gate_notes: "No project evidence row because it is not our claim. Must not enter Abstract/Contributions/Conclusion as an empirical contribution."
  C3:
    statement: "Proposed, artifact-instantiated evidence-accounting and evaluation framework for latent-control affordances: computational READ/TRANSFER results feed a structured evidence or blocking reason, which then determines record-specific interface eligibility and action while retaining the bounded prompt comparator, calibration warning, and evidence tier."
    status: "human-approved core methodological restructuring; proposed and artifact-instantiated from model evidence, with no formal four-state taxonomy and no validated human-facing or operational outcome"
    supporting_evidence_ids: []
    scope: "Pure-model route; no formative or controlled user study; human study deferred/owner-gated"
    paper_sections: ["Abstract", "Introduction", "Interface-evaluation contract", "Limitations", "Conclusion"]
    main_artifacts: ["fig-console-ui-contract"]
    valid_for_paper: "true as a proposed, artifact-instantiated methodological framework derived from model evidence; false as a validated HCI-effectiveness claim"
    gate_notes: "C3 is the primary proposed methodological contribution when consistently expressed as computational result -> structured evidence/blocking reason -> interface eligibility/action. Canonical phrases: 'read-only diagnostic candidate within this evidence tier', 'active control withheld', and 'active control passes the computational gate within this evidence tier'. Diagnostic-only/Unresolved/Unstable/Eligible are not formal states. Do not classify the 0/12 grid as one withheld scientific state or claim user comprehension, usability, reduced over-trust, calibrated reliance, or operational readiness."
  C4:
    statement: "Discussion-only exploratory social-inference-axis extension: the novice/user-model axis is legible in latent space (READ_HOLDS), but the powered LLM-judge TEST finds an honest behavioral null on implemented M1 option-pushing and M4 deference; M2/M3 are not implemented and support no claim."
    status: "discussion-only exploratory extension; behavioral honest-null on implemented M1/M4; READ_HOLDS; valid_for_paper=false"
    supporting_evidence_ids: ["E-0010"]
    scope: "Qwen2.5-7B-Instruct only; single seed; frozen disjoint TEST pool N=54/k=5 for novice-disclosure behavior; LLM-judge-only with human-alpha PENDING, so not confirmatory. B-A M1=+0.00148 CI[-0.0483,+0.0467] p_bonf=1.0; B-E M1=-0.0119 p_bonf=1.0; M4=0. M2/M3 INVALID/not_implemented and must not be described as null dimensions. READ token-blind novice axis holds at layer 8 with AUC=0.954 (literal 1.0, drop 4.6pp, null p95=0.786). Prior DEV/L0 B>A=+0.074/+0.078 did not replicate at power and should be described as DEV noise, not a positive signal. Steer arm HELD per D-0048. Breadth axis remains contextual exploratory material only: single-run facade ratio ~0.271 plus underpowered suppression null with deterministic-echo and general_reasoning dead-zone caveats."
    paper_sections: ["Appendix/context only if retained"]
    main_artifacts: []
    valid_for_paper: false
    evidence_artifacts:
      - "results/flagship_powered/summary.md"
      - "results/flagship_powered/behavior/flagship_l0_results.json"
      - "results/flagship_powered/read/flagship_read_results.json"
      - "docs/ledgers/evidence-ledger.md#E-0010"
      - "docs/ledgers/decision-log.md#D-0048"
      - "docs/ledgers/decision-log.md#D-0049"
    contextual_exploratory_artifacts:
      - "results/breadth_confirm2/breadth_l0_hf_k5_seed20260727.json"
      - "docs/ledgers/decision-log.md#D-0047"
    gate_notes: "Allowed only as a clearly labeled exploratory extension/framing contribution. Must not displace, weaken, or rewrite frozen C1/C2. Must report powered honest-null on implemented M1/M4, M2/M3 not_implemented, READ_HOLDS, LLM-judge-only/human-alpha PENDING, single-model/single-seed/N=54, valid_for_paper=false, steer arm HELD, and breadth deterministic-echo/general_reasoning caveats. It cannot enter Abstract/Contributions/Conclusion as a confirmatory manipulation or control claim."
