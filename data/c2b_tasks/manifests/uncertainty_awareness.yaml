# C2b adjudication task manifest — UNCERTAINTY_AWARENESS axis (behavioral OUTCOME).
#
# Prereg §1: uncertainty_awareness -> calibration (1 - ECE). Ask a factual
# question (some the model gets wrong), elicit "Answer: X. Confidence: 0-100%",
# compute ECE over the test items; outcome = 1 - ECE. This axis gets the MOST
# items (N=80, noisiest metric).

name: uncertainty_awareness
axis: uncertainty_awareness
outcome: one_minus_ece            # 1 - Expected Calibration Error (higher=better)
outcome_range: [0, 1]
scorer: score_uncertainty         # cognitive_console.eval.scorers (set-level ECE)
per_item_outcome: per_item_calibration_score   # 1 - |correct - conf| for the paired bootstrap
answer_field: answer
n_items_frozen: 80                # prereg §5 N for uncertainty (most items)
fixture: uncertainty.jsonl        # ~10 hand-authored factual items (OFFLINE)
real_source:
  type: huggingface
  loader: load_uncertainty_set    # cognitive_console.eval.c2b_tasks (A800 only)
  basis:
    - name: TruthfulQA / trivia-style factual QA with gold answers
      hf_id: truthful_qa
      license: Apache-2.0
  construction: >
    Factual short-answer questions with a gold answer and a plausible distractor,
    chosen so the base model is wrong on a non-trivial fraction (calibration needs
    both correct and incorrect answers to have signal). Elicit an answer + a
    verbalized confidence; ECE over the test pool.
  license: mixed-source-check-required
download_status: deferred
supports:
  claims: [C2b]
  hypothesis: H2
note: >
  AMBIGUITY FLAGGED FOR MANAGER — the prereg defines the axis metric as the
  SET-level (1 - ECE), but §4's paired ITEM-cluster bootstrap needs a per-item
  quantity. This instrument uses per_item_calibration_score = 1 - |correct - conf|
  as the per-item outcome (its set mean = 1 - unbinned calibration error, the
  per-item analogue of 1 - ECE) and reports the binned set ECE descriptively.
