# ─────────────────────────────────────────────────────────────────────────────
# RANKED FINDINGS
# ─────────────────────────────────────────────────────────────────────────────

findings:

  - id: H-01
    severity: BLOCKER
    title: "Kill-rule button score is k=3 (Stage 0) but spec requires k=5 re-evaluation — asymmetric and unfair comparison"
    file: "src/cognitive_console/experiments/e0012_harness.py"
    line: 305
    evidence: >
      run_stage0() applies the kill rule:
        apply_kill_rule(
          auto_prompt_dev_score_k5 = ape_result.auto_prompt_dev_score_k5,  # ✓ truly k=5
          button_dev_score_k5      = best_adv.dev_score_steer,             # ✗ k=3 (K_STAGE0=3)
        )
      best_adv.dev_score_steer is computed in the Stage 0 loop using K_STAGE0=3.
      The variable name "button_dev_score_k5" in apply_kill_rule is misleading:
      the caller passes a k=3 estimate.

      Prereg §5-B kill rule requires BOTH sides evaluated at k=5:
        "mean_1minus_Brier(button, DEV, k=5, frozen_α) ≥
         mean_1minus_Brier(auto_optimized_prompt, DEV, k=5)"
      (emphasis: both k=5).

      Impact on honesty: The asymmetric comparison (k=5 auto-prompt vs k=3 button)
      is systematically biased. If the button's k=3 estimate is noisy HIGH (possible
      on small DEV pool), the kill rule fails to fire when it should (TRANSFER missed →
      false VERIFIED-CONTROL). If noisy LOW, a valid button is misclassified as
      TRANSFER. Because this is the PRIMARY mechanism preventing a promptable result
      from being labeled VERIFIED-CONTROL, any asymmetry directly affects honesty.
    minimum_fix: >
      Before Stage 0 DEV evaluation, re-evaluate each advancing button candidate
      at k=5 on DEV items (same DEV pool used for Stage 0), store as
      dev_score_steer_k5, and pass THAT value to apply_kill_rule().
      A clean implementation: after _select_stage1_candidates() returns the
      advancing list, loop over them and run _eval_items_with_raw_pairs(..., k=K_STAGE1)
      to produce the k=5 button DEV score used for kill-rule comparison only.
      Then pass dev_score_steer_k5 as button_dev_score_k5.

  - id: H-02
    severity: MAJOR
    title: "Brier decomposition in Stage 1 uses 1-Brier proxy as confidence, not actual (confidence, correctness) pairs — reliability guard and gaming test operate on incorrect data"
    file: "src/cognitive_console/experiments/e0012_harness.py"
    line: 506
    evidence: >
      run_stage1_candidate() (lines 506–509):
        steer_outcomes = [b.mean_outcome() for b in steer_batches]
        steer_decomp = brier_decompose(
            steer_outcomes,                                   # used as 'confidences'
            [int(o >= 0.5) for o in steer_outcomes],         # used as 'correctness'
        )

      mean_outcome() returns mean(1 − (conf − correct)²), NOT the verbalized
      confidence value. Using 1-Brier as a "confidence" input creates:
        (a) Systematic upward bias: 1-Brier ∈ [0.75, 1.0] for any conf ∈ [0.5, 1.0]
            correct=1 — all these items are classified as "correct" (int ≥ 0.5 = 1),
            inflating resolution and suppressing reliability signal.
        (b) Brier computed INSIDE brier_decompose becomes mean((1-Brier_orig − 1)²)
            ≠ mean Brier_orig. The decomposition identity B = rel − res + unc holds
            internally but for WRONG inputs, so computed reliability ≠ real reliability.

      Consequence: check_reliability_guard and check_gaming_test compare
      wrong decompositions. A button that genuinely worsens calibration reliability
      could pass the guard (false negative), or a safe button could be blocked
      (false positive). Either direction breaks §9.2's pre-registered honesty guarantee.

      The same approximation appears in _eval_items_with_raw_pairs (line 196-203)
      for the raw_store, with explicit comment: "conservative approximation: we
      cannot back-derive conf/correct from 1-Brier alone." This is correct for the
      synthetic path but the problem is that Stage 1 safety adjudication also uses
      this approximation for real GPU runs.
    minimum_fix: >
      For the GPU path: extend BackendOutcomeSampler / SampleBatch to return
      raw texts alongside outcome scores. In _eval_items_with_raw_pairs, call
      parse_confidence() and item_is_correct() on raw texts to get true
      (confidence, correctness) pairs. Store these in raw_store and pass them
      to brier_decompose. For the synthetic path, the approximation is acceptable
      (offline test only), but the real path MUST use actual pairs before Stage 1
      results can be trusted for safety decisions.

  - id: H-03
    severity: MAJOR
    title: "Stage 0 coherence gate uses hardcoded baseline_degen=0.1 instead of measured baseline — gate ceiling is approximate and unanchored"
    file: "src/cognitive_console/experiments/e0012_harness.py"
    line: 275
    evidence: >
      In run_stage0() Stage 0 loop:
        baseline_degen = 0.1  # approximate baseline (improved by full pipeline)
        coherence_ok = (
            mean_degen <= adj.COHERENCE_MAX_RATIO * baseline_degen + adj.COHERENCE_EPS_FLOOR
        )
        # = mean_degen <= 1.5 × 0.1 + 0.02 = 0.17 (fixed ceiling regardless of model)

      The spec (§9.3 / C2b §3) requires:
        "coherence ≤ 1.5× unsteered baseline"
      The unsteered baseline degeneracy must be MEASURED from the actual unsteered
      model on DEV items, not assumed. If real model baseline_degen ≪ 0.1 (e.g., 0.02
      for a well-behaved model), the ceiling becomes 1.5×0.02+0.02=0.05 — far stricter
      than 0.17. Degenerate candidates (mean_degen ∈ [0.05, 0.17]) would pass Stage 0
      screening incorrectly.
      Conversely, if baseline_degen ≫ 0.1, the ceiling is too permissive.

      Stage 1 correctly measures baseline_degen from actual baseline_batches (line 488).
      Stage 0 should do the same. The discrepancy means Stage 0 and Stage 1 coherence
      gates are applied with different effective thresholds.
    minimum_fix: >
      Compute baseline_degen at the START of run_stage0 from actual unsteered
      baseline samples, then use it for all coherence checks within Stage 0.
      Concretely: run _eval_items_with_raw_pairs(... alpha=0.0, np.zeros(1), ...)
      once per layer (or globally) to get baseline batches, compute
      baseline_degen = mean([b.mean_degeneracy() for b in baseline_batches]).
      Remove the hardcoded constant.

  - id: H-04
    severity: MAJOR
    title: "Bonferroni CI level for Stage 1 single-axis uses 0.05/3 (C2b 3-axis correction) instead of 0.05/M for M advancing candidates on 1 axis"
    file: "src/cognitive_console/experiments/e0012_harness.py"
    line: 483
    evidence: >
      run_stage1_candidate() calls:
        ci = adj.cluster_bootstrap_ci(
            d_items,
            b=adj.BOOTSTRAP_B,
            ci_level=adj.BONFERRONI_CI_LEVEL,   # = 1 − 0.05/3 ≈ 0.9833
            seed=0,
        )

      adj.BONFERRONI_CI_LEVEL is the C2b 3-axis Bonferroni level. The prereg §4
      explicitly states for E-0012:
        "If Stage 1 tests only calibration axis, use α = 0.05 / 1 (single-axis)"
      and §7 Stage 1:
        "If M candidates advance from Stage 0 to Stage 1, Bonferroni-correct over
         M × n_axes comparisons."

      E-0012 tests n_axes=1 (uncertainty_awareness only). For M=1 advancing candidate,
      α_per_test = 0.05/1 → CI level = 0.95. The code uses 0.9833 (3× more conservative).
      For M=2: spec → 0.975, code → 0.9833 (1.5× over-conservative).
      For M=3: spec → 0.9833 = code (correct only for this case).

      Consequence: For M=1 or M=2 advancing candidates, Stage 1 requires a NARROWER
      CI than the prereg prescribes. A button that genuinely exceeds δ=0.05 at the
      pre-registered significance level (CI excludes 0 at α=0.05/M) could fail Stage 1
      because the code requires CI to exclude 0 at the stricter α=0.05/3.
      This creates false negatives (valid buttons failing Stage 1 due to over-correction).
    minimum_fix: >
      Parameterize the CI level dynamically in run_stage1_candidate or in
      run_e0012_harness based on M (len(stage0.advancing)) and n_axes=1:
        bonferroni_ci_level = 1.0 - 0.05 / max(1, len(advancing_candidates))
      Pass this to cluster_bootstrap_ci. If M=0 (shouldn't reach Stage 1),
      handle as no-op. This matches §4 and §7 Stage 1 exactly.

  - id: H-05
    severity: MINOR
    title: "Stage 0 selection tie-breaking: coherence ratio not stored per candidate; spec tie-break order not fully implemented"
    file: "src/cognitive_console/experiments/e0012_harness.py"
    line: 133
    evidence: >
      _select_stage1_candidates() sorts:
        passing.sort(key=lambda c: (-c.dev_improvement, c.button_family))
      Comment: "ties broken by family name alphabetically"

      Prereg §7 Stage 0 F-03 specifies:
        "ties broken by lower coherence ratio, then by button family name alphabetically"

      Stage0Candidate has coherence_ok (bool) but not coherence_ratio (float).
      The actual coherence ratio is computed inside run_stage0() but not stored.
      Therefore tie-breaking skips the coherence-ratio step and goes directly to
      alphabetical family name. This is only relevant when multiple candidates share
      the same dev_improvement to ≥4 decimal places, but the spec requires it.
    minimum_fix: >
      Add coherence_ratio: float field to Stage0Candidate. Store the actual
      mean_degen / baseline_degen value (before the gate check) so tie-breaking can
      use it. Update _select_stage1_candidates sort key:
        passing.sort(key=lambda c: (-c.dev_improvement, c.coherence_ratio, c.button_family))

  - id: H-06
    severity: MINOR
    title: "Real-backend raw pair recording uses 1-Brier proxy — acknowledged but no GPU implementation path documented"
    file: "src/cognitive_console/experiments/e0012_harness.py"
    line: 186
    evidence: >
      _eval_items_with_raw_pairs() records raw pairs as:
        confidence = float(np.clip(outcome, 0.0, 1.0))   # 1-Brier, not verbalized conf
        correctness = int(outcome >= 0.5)                 # proxy, not true behavioral correctness
      Comment says: "A real implementation should return raw texts from the backend."

      This is acceptable for the synthetic offline path. However, there is no
      documented GPU implementation plan — no TODO, no issue reference, no GPU
      backend extension spec. If the GPU run starts without fixing this, the
      JSONL raw pair store will silently contain incorrect values, and the Brier
      decomposition computed post-hoc from the raw store will be wrong (same
      issue as H-02 but from the stored artifact).

      §9.2 requires per-item raw (confidence, correctness) pairs be stored
      "from the outset." A JSONL full of 1-Brier proxies does not satisfy this.
    minimum_fix: >
      Document the GPU implementation path in the code as a TODO with the exact
      expected API extension: e.g., "SampleBatch must carry raw_texts alongside
      outcomes; BackendOutcomeSampler.sample() must return generated text for
      parse_confidence/item_is_correct to extract the true pair." This prevents
      silent bad data collection during the GPU run. Ideally, implement before boot.

