review_summary:
  top_3_rejection_risks:
    - "THEORY OVER-APPLICATION (R1-F1): headline 'prompts provably can't reach it' is not entailed by Mishra (internal-state, not behavioral); Stolfo can be weaponized against it. If unfixed, the theoretical spine of RQ2 breaks under review."
    - "OBVIOUS-COMBINATION / 'NLP dressed as HCI' (R1-F2): every ingredient except quantified-facade + conflict-attribution is published (Huang&Lim, Labarta, AI-Instruments, Tankelevitch); novelty is contingent on unproven results, and the non-obvious design insight is asserted not specified."
    - "INCOMPLETE SCOOP CLEARANCE + naming collision (R1-F6, R1-F5): manual CHI'26/ACM-DL sweep still owed (AI search hallucinated neighbors), and 'dual-channel steering' is already coined for a different ML method — a concurrent CHI'26 paper or reviewer deja-vu could sink novelty."
  must_fix_before_next_gate:
    - "R1-F1: separate internal-state non-surjectivity (proven, cited) from behavioral unreachability (empirical, to demonstrate); remove/qualify 'provably'; specify a fair prompt-optimization budget."
    - "R1-F2: state the specific non-obvious design contribution + a pre-registered measure that would falsify 'obvious combination'."
    - "R1-F4: correct the SemanticLens/Labarta mis-framing (two works, vision, experts; honest trust pre-emption note)."
    - "R1-F6: run and record the manual CHI'26/ACM-DL prior-art sweep; downgrade self-rated scoop LOW -> MED."
    - "R1-F5: rename the paradigm off 'dual-channel steering'."
  optional_improvements:
    - "R1-F3: re-scope C1 so novelty is the trust-relevant surfaced facade, not the near-trivial projection<100%."
    - "R1-F7: verify or drop the ActAdd Appendix B side-evidence before it reaches the paper."
    - "R1-F8: explicitly firewall C3 as non-gating extension."
  questions_for_manager:
