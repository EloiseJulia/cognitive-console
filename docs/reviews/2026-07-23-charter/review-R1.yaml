# ============================================================================
# HUMAN-READABLE SUMMARY (R1 — Novelty & Significance, CHI, Charter stage)
# ----------------------------------------------------------------------------
# Verdict: MAJOR-REVISION (charter viable to freeze only after wording + prior-art fixes).
# The core idea — making the *prompt<->latent non-surjective gap itself* an operable,
# calibratable interface object — is the freshest, least-occupied framing in this space
# and is NOT a trivial steering+slider mashup ON PAPER. But three things put CHI
# acceptance at real risk and MUST be closed before the next gate:
#   1. THEORY OVER-APPLICATION (BLOCKER-class for the *claim wording*, not the idea):
#      Mishra proves non-surjectivity of INTERNAL activations; C2 asserts BEHAVIORAL
#      unreachability ("prompt can't cross a threshold the slider can"). That inference
#      is unearned and Stolfo et al. (instruction<->vector correspondence) can be
#      weaponized against it. The charter leans its headline on a result that does not
#      entail the headline.
#   2. "OBVIOUS COMBINATION" RISK vs Huang&Lim (layperson steering sliders + study),
#      AI-Instruments (control-as-direct-manipulation object), Labarta (interactive
#      attribution->steering + user study + trust), Tankelevitch (metacognition framing).
#      The whole contribution currently rests on ONE not-yet-demonstrated differentiator:
#      quantified facade (RQ1) + genuine prompt<->latent CONFLICT attribution (RQ2). If
#      those collapse empirically, the paper degrades to "a prompt box next to their sliders."
#   3. SIGNIFICANCE / "NLP dressed as HCI": the interaction insight that could NOT be
#      predicted from the 5 neighbors is asserted, not yet evidenced. CHI reviewers will
#      demand design knowledge that transcends "add explainability + customizability"
#      (which Tankelevitch already recommended).
# Also: correct the SemanticLens/Labarta mis-framing (vision+experts, not an LLM UI
# competitor) and rename "dual-channel" (ICLR'26 W already owns "Dual-Channel Steering").
# None of these are fatal at Charter stage; all are cheap to close pre-experiment.
# score_if_unchanged: 2.0-2.5/5 ; score_if_blockers_closed: 3.0-3.5/5 (borderline->positive).
# ============================================================================

review_id: review-R1-charter-2026-07-23
snapshot_id: charter-2026-07-23
reviewer_role: "R1 — Novelty & Significance (independent, no stake)"
target_venue: CHI
review_stage: charter
review_scope: >
  Charter-gate review (pre-experiment). Assess novelty, significance, and CHI-fit of the
  proposed contribution and the falsifiable claims C1-C3. Judge whether the defensible
  one-sentence novelty survives against the nearest neighbors and the Novelty-Falsification
  report's scoop findings. NOT assessing full results/paper (none exist yet — correct for stage).

materials_examined:
  - docs/charter/project-charter.md (v0.1 DRAFT)
  - docs/research/2026-07-23-novelty-falsification.md (independent Novelty Gate output)
  - docs/ledgers/claim-ledger.md (C1-C3)
  - 开题报告_非满射双通道认知控制台.md (author intent / background)
  - AI-Instruction.md Part I §10 (review protocol/format)

missing_materials:
  - No system/prototype, no Phase-0 pilot data, no facade projection numbers (expected: pre-experiment stage; not penalized).
  - No completed manual CHI'26 / ACM DL prior-art sweep (Novelty report §3 flags it as still owed — treat "field is clear" as PROVISIONAL).
  - ActAdd "Appendix B exclusion experiment" sub-claim unverified (Novelty report §2, §6.4) — flagged [NEEDS EVIDENCE], not yet load-bearing for a claim.
  - No claim->evidence paper-location mapping yet (claim-ledger "Paper location: TBD") — acceptable at charter stage.

expertise_level: "high (HCI + representation-engineering/steering literature); medium on the exact non-surjectivity proof internals"
conflict_check: "no conflict; did not author charter/idea; did not read Manager expectations or any desired verdict"
overall_score_range: "2.0-3.5 / 5 (conditional: 2.0-2.5 if unchanged; 3.0-3.5 if blockers closed)"
