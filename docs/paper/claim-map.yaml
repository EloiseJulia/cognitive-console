claims:
  C1:
    statement: "Representational legibility/facade gap: on selected cognitive axes, a readable prompt reaches only part of the extracted axis pole in mid-layer activation space."
    status: "partially-supported; exploratory two-model support at the 3/4 aggregate level, with per-axis heterogeneity"
    supporting_evidence_ids: ["E-0003", "E-0008"]
    scope: "Qwen2.5-7B-Instruct and Llama-3-8B-Instruct; deliberation and skepticism hold in both; uncertainty holds on Qwen not Llama; focus holds on Llama but overshoots/no-facade on Qwen"
    paper_sections: ["Abstract", "Introduction", "Methods", "Results", "Limitations", "Conclusion"]
    main_artifacts: ["fig-ratio-ci", "table-c1-twomodel"]
    valid_for_paper: "false for confirmatory/core claim per evidence ledger; usable only if explicitly labeled exploratory/scoped"
    gate_notes: "E-0003 and E-0008 both have valid_for_paper=false for confirmatory use. Mark exploratory everywhere; say aggregate support replicates but axis composition does not."
  C2:
    statement: "Legibility does not transfer to behavioral controllability for naive/bounded CAA/ITI steering: across CAA/ITI x Qwen2.5-7B/Llama-3-8B, steering fails to beat the bounded best-prompt ceiling on all tested axes and harms uncertainty calibration in all four cells."
    status: "supported as a pre-registered negative generalized across tested methods and models"
    supporting_evidence_ids: ["E-0005", "E-0006", "E-0009"]
    scope: "Frozen C2b adjudicator; core headline is {CAA, ITI} x {Qwen2.5-7B, Llama-3-8B}; axes deliberation, skepticism, uncertainty_awareness; bounded prompt effort; naive/off-the-shelf steering. E-0009 is exploratory supporting evidence only for robustness to method strength on Qwen2.5-7B."
    paper_sections: ["Abstract", "Introduction", "Methods", "Results", "Limitations", "Conclusion"]
    main_artifacts: ["table-c2-delta-4cell", "fig-calibration-harm-4cell"]
    valid_for_paper: true
    exploratory_supporting_evidence_ids: ["E-0009"]
    core_evidence_ids: ["E-0005", "E-0006"]
    gate_notes: "Passes Abstract/Contributions/Conclusion evidence gate via E-0005 and E-0006. E-0009 is single-model/single-seed/valid_for_paper=false exploratory support; it must not overwrite or upgrade the frozen headline."
  C2-mech:
    statement: "Calibration harm might be explained by off-manifold steering distance."
    status: "hypothesis/future work only; directly tested and not supported"
    supporting_evidence_ids: ["E-0007"]
    scope: "Whitened Mahalanobis OOD distance vs per-item calibration harm, uncertainty axis, four CAA/ITI x Qwen/Llama cells"
    paper_sections: ["Results", "Limitations", "Future Work"]
    main_artifacts: []
    valid_for_paper: "future-work/null-result context only; not a contribution"
    gate_notes: "E-0007 is a valid null, not support for the mechanism. Do not enter Abstract/Contributions/Conclusion as a positive claim."
  C2a:
    statement: "Internal-state non-surjectivity: steered residual activations may be unreachable by bounded prompts."
    status: "background/motivation only"
    supporting_evidence_ids: []
    scope: "Mishra et al. theory/background; not empirically tested by this project"
    paper_sections: ["Introduction", "Related Work"]
    main_artifacts: []
    valid_for_paper: "background citation only; not our empirical claim"
    gate_notes: "No project evidence row because it is not our claim. Must not enter Abstract/Contributions/Conclusion as an empirical contribution."
  C3:
    statement: "A cognitive console should surface boundaries/limits of legible latent control and support trust recalibration rather than advertise a latent control slider."
    status: "design implication only; no user study yet"
    supporting_evidence_ids: []
    scope: "Pure-model route; no formative or controlled user study; human study deferred/owner-gated"
    paper_sections: ["Abstract", "Introduction", "Design implications", "Limitations", "Conclusion"]
    main_artifacts: []
    valid_for_paper: "flagged: no standalone evidence row; usable only as a non-empirical design implication derived from C2, not as an empirical contribution"
    gate_notes: "FLAG: lacks a direct evidence row. If C3 enters Abstract/Contributions/Conclusion as a standalone claim or empirical HCI contribution, the bidirectional gate fails; it may only appear as a clearly marked design implication from C2."
  C4:
    statement: "Exploratory social-inference-axis probe: the legibility-versus-controllability lens may generalize from metacognitive axes to user-model conditioning, but current novice-disclosure and breadth-persona L0 results are underpowered and not confirmatory."
    status: "exploratory supporting/diagnostic only; valid_for_paper=false"
    supporting_evidence_ids: ["L0-flagship-confirm-D0046", "L0-breadth-confirm2-D0047"]
    scope: "Qwen2.5-7B only; DEV-only 14-item novice-disclosure pool for M1/M4 and N=12 breadth-persona suppression probe. M1 B>A is directional (+0.074) and replicates earlier +0.078 but item-level p≈0.068, leans partly on one item, uses a self LLM judge, and lacks human-calibration alpha>=0.60. B>E is null/underpowered; M4 deference-exploitation is a genuine behavioral null. Breadth axis legibility is a single-run readout (facade ratio ~0.271); the re-run was a deterministic echo, not an independent replication. Suppression is a credible exploratory null after fixing the classifier artifact, with CI spanning 0 and a general_reasoning dead-zone caveat."
    paper_sections: ["Abstract", "Introduction", "Discussion", "Future Work"]
    main_artifacts: []
    valid_for_paper: false
    evidence_artifacts:
      - "results/flagship_confirm/flagship_l0_results.json"
      - "results/breadth_confirm2/breadth_l0_hf_k5_seed20260727.json"
      - "docs/ledgers/decision-log.md#D-0046"
      - "docs/ledgers/decision-log.md#D-0047"
      - "docs/research/2026-07-27-prereg-novice-manipulation-DRAFT.md"
    gate_notes: "Allowed only as a clearly labeled exploratory extension/probe. Must not displace or weaken C1/C2; must report B>E, M4, and suppression nulls plus self-judge, human-calibration-pending, deterministic-echo, and general_reasoning-dead-zone caveats. It cannot enter Abstract/Contributions/Conclusion as a confirmatory or standalone manipulation claim."
