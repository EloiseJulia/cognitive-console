<!doctype html>
<html lang="und">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>请选择语言 / Choose a language</title>
  <link rel="stylesheet" href="study.css">
  <script type="module" src="study.js"></script>
</head>
<body>
  <section id="desktop-blocker" role="alert">
    <h1>Desktop preview required / 需要桌面预览</h1>
    <p>This DRAFT requires at least 1024 CSS pixels.</p>
    <p>本 DRAFT 需要至少 1024 CSS 像素宽度。</p>
  </section>
  <header id="site-header" hidden>
    <strong id="header-title"></strong>
    <span id="fiction-banner"></span>
    <button id="save-exit-button" type="button" data-action="save-exit" hidden></button>
  </header>
  <main id="app">
    <section id="language-gate" class="panel language-gate">
      <h1 tabindex="-1">请选择语言 / Choose a language</h1>
      <p class="fiction-notice">所有产品、按钮和试用记录均为虚构示意，不代表真实产品功效。</p>
      <p class="fiction-notice">All products, buttons, and trial records are fictional examples and do not represent real product effects.</p>
      <div class="language-actions" role="group" aria-label="语言 / Language">
        <button type="button" data-action="choose-language" data-locale="zh-Hans" disabled>简体中文</button>
        <button type="button" data-action="choose-language" data-locale="en" disabled>English</button>
      </div>
      <p id="gate-error" class="error" role="alert" tabindex="-1"></p>
    </section>
    <section id="start" class="panel" hidden></section>
    <section id="stage" class="panel" hidden></section>
  </main>
  <footer id="site-footer" hidden></footer>
  <dialog id="save-exit-dialog">
    <h2 id="save-exit-heading"></h2>
    <p id="save-exit-body"></p>
    <div class="actions">
      <button type="button" class="secondary" data-action="cancel-save-exit"></button>
      <button type="button" data-action="confirm-save-exit"></button>
    </div>
  </dialog>
</body>
</html>
