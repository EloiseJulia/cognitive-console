new_validity_concerns:

  - id: R3-MINOR-1
    severity: MINOR
    category: Construct Validity (H2-DV1 secondary DV only)
    title: "H2-Q5 在 A 条件中可被标签回忆作答，导致 H2-DV1 跨条件测量不等价"
    description: |
      H2-Q5 正确答案："可读性检查通过，转移测试通过，无校准风险警告"——
      这是 A 条件界面的直接词汇（READ=HOLDS + TRANSFER=PASS + CALIBRATION-HARM=none）。
      Group A 参与者可通过回忆界面标签作答，无需理解底层机制。
      Group B 参与者看到的是 Signal-1/Signal-2/Signal-4 中性标签，无法直接回忆，
      必须理解概念才能映射到 H2-Q5 的答案。
      结果：A 条件的 H2-DV1 优势可能部分来自"记忆界面词汇"而非"理解边界机制"，
      与 H2 的初衷（测量概念理解而非标签记忆）相违背。
    does_this_reopen_blocker_5: false
    affected_scope: "H2-DV1（次要 DV）仅，不影响主 DV（WAR）或 H1 成功判据"
    cheapest_fix: |
      将 H2-Q5 改写为中性场景语言，不使用 A 条件词汇。示例改写：
      "下列哪种情形最支持对 AI 建议的校准依赖？
      A. AI 的表达能力检测正常、内部行为泛化稳定、无校准风险发现
      B. AI 建议与用户直觉一致
      C. 用户对领域不熟悉，所以选择信任
      D. AI 建议字数多、细节丰富"
      A 选项描述的是相同的三重正向条件，但使用不依赖 A 条件界面标签的语言。
    fixable_without_redesign: true

  - id: R3-NOTE-1
    severity: NOTE (pre-existing, not introduced by Revision-2)
    category: Ecological Validity
    title: "Signal profiles 来自 Qwen/Llama CAA 实验，但 vignette 域为 consumer/health/legal/finance"
    description: |
      READ/TRANSFER/CALIBRATION-HARM 信号来源于 flagship_read_results.json、
      c2b_adjudication_results.json 等——这些是对 Qwen/Llama 在 deliberation/skepticism/
      uncertainty/focus 轴上的 CAA 实验产物。
      而 vignettes 的 domain 是 consumer、finance、health、legal、privacy、education。
      信号并非从这些 domain 的实际使用中测量得出，而是作为"界面刺激素材"从不同实验移植。
      这一生态效度问题已在 R1 中被标注（R1 BLOCKER-2 原始版本的核心批评）。
      Revision-2 的设计选择（将信号作为界面信息，而非 domain 预测器）缓解但未消除这一问题。
      这是研究设计的固有边界，在论文中应明确说明。
    does_this_reopen_blocker_5: false
    introduced_by_revision_2: false

