top_3_risks:

  - rank: 1
    risk: "Prompt-comparator too weak → spurious VERIFIED-CONTROL"
    description: >
      Auto-optimized prompt procedure under-specified (F-01). If the optimization budget is small
      and the button "wins" only because a stronger prompt would have beaten it, the VERIFIED-CONTROL
      claim is a false positive. This risk is EXECUTION-blocking: must fix before any GPU runs.
      This is the highest-probability and highest-impact failure mode.

  - rank: 2
    risk: "No non-trained button found → paper lacks positive empirical anchor"
    description: >
      The novelty-falsification document correctly identifies this as HIGH execution risk. If Stage 0
      finds no candidate meeting the DEV cutoff, or if all Stage 0 candidates fail Stage 1, the
      paper reverts to a pure negative with the taxonomy as the contribution. The current paper
      (main.tex) already reads this way. E-0012 would not upgrade it. This is the central
      strategic risk, not a protocol flaw — but it means the GPU budget is a real gamble.

  - rank: 3
    risk: "BTN-CAL-CONTRA-REEXTRACT or BTN-CAL-PROBE classified as PSR-family post-hoc → Heyman collapse"
    description: >
      If the winning button, on inspection, turns out to require behavioral-outcome-informed
      direction derivation (F-02), the VERIFIED-CONTROL novelty claim collapses to "PSR applied
      to calibration axis under a frozen adjudicator." This is publishable but is a weaker novelty
      story. The fix (specifying the non-training criterion exactly before running) prevents
      post-hoc dispute, but it requires careful pre-specification of each button family's
      derivation procedure.

