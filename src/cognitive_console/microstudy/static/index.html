<!doctype html>
<html lang="und">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>请选择语言 / Choose a language</title>
  <link rel="stylesheet" href="study.css">
  <script src="study.js" defer></script>
</head>
<body>
  <header id="site-header" hidden>
    <strong id="header-title"></strong>
    <span id="header-privacy"></span>
    <button id="save-exit-button" type="button" data-action="save-exit" hidden></button>
  </header>
  <main id="app">
    <section id="language-gate" class="panel language-gate">
      <h1 tabindex="-1">请选择语言 / Choose a language</h1>
      <div class="language-actions" role="group" aria-label="语言 / Language">
        <button type="button" data-action="choose-language" data-locale="zh-Hans" disabled>简体中文</button>
        <button type="button" data-action="choose-language" data-locale="en" disabled>English</button>
      </div>
      <p id="gate-error" class="error" role="alert" tabindex="-1"></p>
    </section>
    <section id="start" class="panel" hidden></section>
    <section id="stage" class="panel" hidden></section>
  </main>
  <footer id="site-footer" hidden></footer>
</body>
</html>
