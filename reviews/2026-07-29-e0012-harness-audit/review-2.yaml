h01_kill_rule_k5_symmetry:
  original_severity: BLOCKER
  claimed_fix: "Re-evaluate best advancing candidate at k=K_STAGE1=5 on DEV before kill rule."
  independent_verdict: FIXED
  evidence: >
    Stage0Candidate now has dev_score_steer_k5: Optional[float] = None (line 105).
    run_stage0() (lines 390–415):
      After _select_stage1_candidates(), the code re-evaluates advancing[0]
      using _eval_items_with_raw_pairs(..., K_STAGE1, ...) where K_STAGE1=5.
      Stores result as button_dev_score_k5 and passes it to apply_kill_rule().
    apply_kill_rule() signature unchanged: both args are now genuinely k=5.
    Constructed test: button k3=0.70 vs APE k5=0.66 → old code: PASS (biased HIGH);
    new code (k5=0.65): TRANSFER (correct). Outcome changed by k-correction.
    Same DEV pool used for both sides (dev_items passed through consistently). ✓
    New tests (test_e0012.py lines 1015–1087) exercise this path.
  residual_risk: NONE
  kill_rule_direction: >
    Both sides now use the same k=5 estimate on the same DEV pool.
    Kill rule is symmetric. TRANSFER/VERIFIED-CONTROL classification is honest.

h02_brier_real_pairs_gpu_path:
  original_severity: MAJOR
  claimed_fix: >
    TextCapableSampler ABC added; _eval_items_with_raw_pairs routes GPU path to
    real (conf, correct) pairs via sample_with_texts(); synthetic path tagged
    synthetic_proxy=True; BrierRawStore.decompose_channel(require_real=True)
    prevents proxy data from being used for authoritative GPU safety decisions;
    run_stage1_candidate() uses has_real_pairs() to select the real-pair path.
  independent_verdict: PARTIALLY-FIXED
  architecture_fix_confirmed: true
  evidence_for_partial_fix: >
    (a) TextCapableSampler is defined in harness.py (lines 159–191):
        abstract class with sample_with_texts() → (SampleBatch, List[str]).
        isinstance(adj.BackendOutcomeSampler, TextCapableSampler) == False. ✓
    (b) _eval_items_with_raw_pairs (lines 198–279):
        is_gpu_capable = isinstance(sampler, TextCapableSampler)
        GPU branch: calls sample_with_texts(), extracts conf/correct via
          parse_confidence() and item_is_correct(), records synthetic_proxy=False. ✓
        Synthetic branch: records with synthetic_proxy=True. ✓
    (c) BrierRawStore.has_real_pairs() / decompose_channel(require_real=True) work
        correctly (independently verified with BrierRawStore test). ✓
    (d) run_stage1_candidate() correctly routes to real-pair path when
        has_real_pairs() returns True. ✓
  critical_gap_remaining: >
    scripts/run_e0012_verified_control.py (lines 158–165) creates the HF sampler as:
      sampler = adj.BackendOutcomeSampler(hf_backend, ...)
    BackendOutcomeSampler is NOT a TextCapableSampler subclass (confirmed at runtime:
      issubclass(adj.BackendOutcomeSampler, TextCapableSampler) == False).
    Therefore on real GPU runs:
      - _eval_items_with_raw_pairs takes the ELSE branch (raw_texts = None)
      - BrierRawStore receives records with synthetic_proxy=True
      - has_real_pairs(chan_steer) → False
      - run_stage1_candidate() falls to the "synthetic proxy fallback"
      - steer_decomp / base_decomp are computed from 1-Brier proxy values
      - evaluate_safety(steer_decomp, base_decomp, ...) runs on these WRONG decompositions
    The comment "SYNTHETIC PROXY: ... Not valid for real GPU safety adjudication"
    is accurate, but the code does NOT prevent the safety evaluation from running
    on this data — is_brier_from_real_pairs=False is informational only; safety is
    still evaluated and used in the verdict.
    Demonstrated: proxy reliability/gaming guards fail to catch a gaming scenario
    where steer_outcomes improve (1-Brier proxy rises) while real calibration worsens
    (gaming_test → False on proxy, should be True on real pairs).
    TODO in TextCapableSampler (line 166) explicitly says "required before A800 boot"
    but the implementation is NOT present in the run script.
  impact_on_gpu: >
    §9.1 accuracy guard: NOT affected by H-02 gap (uses batch outcomes, not decomps). ✓
    §9.4 cross-axis: NOT affected (not wired in Stage 1 yet, marked SKIPPED). ✓
    §9.2 reliability guard + gaming test: STILL BROKEN on GPU — will silently
    use proxy decompositions; false negatives are the dominant failure mode
    (a genuine gaming button may pass BUTTON_FOUND_BUT_UNSAFE).
    This is the same §9.2 failure as the original H-02, just with better labeling.

h03_baseline_degen_measured:
  original_severity: MAJOR
  claimed_fix: "Measure actual unsteered baseline_degen from DEV samples; remove hardcoded 0.1."
  independent_verdict: FIXED
  evidence: >
    run_stage0() (lines 322–337):
      Calls _eval_items_with_raw_pairs(... alpha=0.0, np.zeros(1), L_C1, K_STAGE0, ...)
      on the actual dev_items to get baseline_dev_batches.
      stage0_baseline_degen = mean([b.mean_degeneracy() for b in baseline_dev_batches]).
      Guard: if stage0_baseline_degen <= 0.0 → set to adj.COHERENCE_EPS_FLOOR (0.02).
      Coherence gate uses this measured value: mean_degen <= 1.5*stage0_baseline_degen + 0.02.
    Independently verified: synthetic run with 5 items produced non-trivial coherence_ratios
    for non-zero alpha combinations (15 non-zero of the 15 where synthetic backend
    produces non-zero degeneration; remaining 90 had mean_degen=0.0 as expected for
    small alpha in synthetic backend → coherence_ratio=0.0 by the guard path).
    The guard path (baseline=0 → COHERENCE_EPS_FLOOR) is correct and strict:
    ceiling = 1.5×0.02+0.02 = 0.05 (much stricter than old hardcoded 0.17).
  residual_risk: NONE (for GPU: measured baseline will be non-zero, guard is moot)

