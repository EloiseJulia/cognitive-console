# Submission-Readiness Gap List — Reviewer R1 (IUI-first / CHI-experience / FAccT-AIES)
# Node: Submission Readiness  |  Date: 2026-07-28  |  Reviewer: R1 (independent, read-only)
# Frozen-fact epoch confirmed before review.  Only reads; does not modify any paper file.

metadata:
  paper_title: "Legible Need Not Be Controllable: A Frozen Reality Check for Prompt-vs-Latent Behavioral Control in LLMs"
  pdf_page_count: 9
  build_status: clean  # 0 undefined citations, 0 errors; only ACM-refformat advisory + balance warning
  format: sigconf (ACM two-column)
  review_inputs_read:
    - AGENTS.md
    - docs/paper/main.tex
    - docs/paper/claim-map.yaml
    - docs/ledgers/claim-ledger.md
    - docs/ledgers/evidence-ledger.md
    - docs/paper/reframe-2026-07-24-reality-check.md
    - docs/ledgers/open-risks.md
    - docs/paper/overview-zh.md
    - docs/paper/tables/c2-delta-4cell.tex
    - docs/paper/tables/c1-twomodel.tex
