findings:

  - id: F-01
    severity: MAJOR
    file: scripts/run_e0012_verified_control.py
    line: 186-188
    title: "APE candidate generation used pre-authored synthetic bank instead of model-generated candidates (protocol deviation from §5-B)"
    evidence: |
      In the hf (GPU) branch of cmd_run(), the code reads:
        candidates = generate_candidates_synthetic(APE_N_CAND, APE_SEED)  # fallback
        # Real: candidates = generate_candidates_real(sampler.gen, APE_N_CAND, APE_SEED, ...)
      The real LLM-based generation is COMMENTED OUT. The frozen prereg §5-B mandates:
        - LLM for generation = same model (Qwen2.5-7B-Instruct)
        - Use frozen meta-prompt template
        - N_cand=50, seed=42
      Instead, generate_candidates_synthetic() returns a pre-authored bank of 50
      human-written calibration prompts (from _SYNTHETIC_APE_CANDIDATES in e0012_ape.py),
      NOT prompts generated by the model via the frozen meta-prompt.
      This is a deviation from the frozen pre-registration §5-B. The APE winner (scoring
      0.8270 at k=5) comes from the best of these 50 pre-authored prompts, not from
      a model-generated candidate set.
    why_not_blocker: |
      The gap between APE winner k5 (0.8270) and button best k3 (0.704) is 0.1230
      (12.3 percentage points). For TRANSFER to be wrong under real APE, model-generated
      prompts would need to score < 0.704 at k=5 — i.e., be ~12pp WORSE than the
      pre-authored bank. LLM-generated calibration prompts are unlikely to be uniformly
      that much worse. Bias direction: pre-authored human expert prompts ≥ model-generated
      prompts in quality → TRANSFER is more (not less) likely under real APE → deviation
      is conservative (makes TRANSFER harder to achieve, so if it fires via pre-authored
      comparator, real APE would also likely fire or be close).
    minimum_fix: |
      Option A (preferred): Update runner.py to call generate_candidates_real() on GPU runs
      and document the actual prompts used. Re-run APE with real model-generated candidates
      and confirm kill rule still fires (expected given 12.3pp margin).
      Option B (acceptable for paper): Note explicitly in paper + evidence-ledger that
      "APE comparator used pre-authored calibration prompt bank (50 prompts)" rather than
      claiming model-generated prompts. The finding is still scientifically valid: a strong
      human-authored calibration prompt beats the button's best DEV score. Reframe the
      paper claim accordingly.

  - id: F-02
    severity: MINOR
    file: scripts/run_e0012_verified_control.py
    line: 244
    title: "results.json valid_for_paper=true auto-set by HF backend logic; inconsistent with registry PENDING"
    evidence: |
      Runner code: `"valid_for_paper": args.backend == "hf"` → sets True for any HF run
      automatically, regardless of audit state.
      e0012_results.json has valid_for_paper: true.
      experiment-registry.yaml has valid_for_paper: false # PENDING audit.
      evidence-ledger has valid_for_paper=PENDING.
      The inconsistency is harmless in practice (registry/ledger correctly override),
      but anyone reading the results JSON directly sees True before audit is complete.
    minimum_fix: |
      Change runner to output valid_for_paper: false always (or add --valid-for-paper flag).
      Or add a note in results JSON: "valid_for_paper_note": "PENDING independent hostile audit".
      Registry and evidence-ledger are already correct; this is a documentation alignment fix.

  - id: F-03
    severity: MINOR
    file: results/E-0012/e0012_results.json
    line: "N/A (missing field)"
    title: "button_dev_score_k5 not persisted; kill rule comparison values not fully reconstructable from artifacts"
    evidence: |
      The kill rule compares APE winner k5 vs button best DEV k5 (after k=5 re-evaluation
      of the best advancing candidate per H-01 fix). The button's k=5 score is computed
      in run_stage0() (harness line 409: button_dev_score_k5) and stored on the candidate
      object in memory (best_adv.dev_score_steer_k5), but this value is NOT serialized to
      e0012_results.json or e0012_stage0_candidates.json.
      Verifiers cannot directly read both sides of the kill rule comparison from artifacts.
      The k3 score (0.704) is known from stage0_candidates.json. The k5 score is implicit
      (must be < 0.8270 for TRANSFER to fire, which we can infer from the verdict, but
      the exact value is unknown).
    minimum_fix: |
      Add `button_best_dev_k5` and `button_best_family_layer_alpha_for_k5` to results JSON.
      Also add `dev_score_steer_k5` to the stage0_candidates serialization for the advancing
      candidates. This requires no re-run — values are computed in this run but not saved.

  - id: F-04
    severity: UNVERIFIED
    file: scripts/run_e0012_verified_control.py
    line: 183-188
    title: "APE winner prompt text not recorded in results JSON; identity of winning prompt unverifiable"
    evidence: |
      The APE winner's prompt_text (which of the 50 candidates scored best) is not saved
      to e0012_results.json. We know the winner scores (k3=0.8198, k5=0.8270) and that it
      comes from the pre-authored bank of 50 (shuffled by seed=42), but the exact prompt
      text is not persisted. Independently verifying which prompt won is not possible from
      the saved artifacts alone (would require re-running APE).
    minimum_fix: |
      Add `ape_winner_prompt_text` and `ape_winner_candidate_id` to results JSON. No re-run needed.

