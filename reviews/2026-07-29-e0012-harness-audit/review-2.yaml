findings:

  - id: N-01
    severity: MAJOR
    title: >
      Run script HF path wraps SteeredHFBackend in BackendOutcomeSampler — NOT
      TextCapableSampler; GPU §9.2 safety guards still silently use proxy data
    file: "scripts/run_e0012_verified_control.py"
    line: 161
    evidence: >
      scripts/run_e0012_verified_control.py (lines 158–165):
        hf_backend = SteeredHFBackend(model_name=model_name)
        sampler = adj.BackendOutcomeSampler(hf_backend, ...)

      issubclass(adj.BackendOutcomeSampler, TextCapableSampler) → False (confirmed).

      Effect on GPU run:
        _eval_items_with_raw_pairs: is_gpu_capable = False → takes the synthetic-proxy
        branch → BrierRawStore records all have synthetic_proxy=True.
        run_stage1_candidate: has_real_pairs(chan_steer) → False →
        falls to proxy fallback → steer_decomp / base_decomp from 1-Brier proxy.
        evaluate_safety() runs on proxy data (NOT isolated despite the comment).

      Demonstrated failure mode:
        Proxy scenario: steer_outcomes = [0.90..0.92] (high 1-Brier, looks good).
        Proxy decomp: reliability ≈ 0 (all classified correct=1), gaming guard = False.
        Real scenario (same button, overclaims confidence from 0.70→0.95 while
        correctness stays 0.70): real Brier reliability would worsen significantly;
        gaming guard should fire → BUTTON_FOUND_BUT_UNSAFE.
        Proxy path: gaming guard does NOT fire → button passes as LOCAL.

      The TODO in TextCapableSampler says "required before A800 boot" but is not
      implemented in the run script.

    minimum_fix: >
      Before A800 boot, implement SteeredHFTextCapableSampler in
      cognitive_console/steering/generate.py (or a new file) that:
        1. Subclasses TextCapableSampler (and wraps SteeredHFBackend).
        2. Implements sample_with_texts(axis, item, instruction, alpha, k, direction, layer)
           to call format_task_input(), SteeredHFBackend.generate() k times, score via
           score_sample_outcome(), and return (SampleBatch, [text_0..text_{k-1}]).
      In run_e0012_verified_control.py (line 161), replace:
        sampler = adj.BackendOutcomeSampler(hf_backend, ...)
      with:
        sampler = SteeredHFTextCapableSampler(hf_backend, ...)
      Add a runtime assertion before Stage 1:
        assert isinstance(sampler, TextCapableSampler), "GPU run requires TextCapableSampler"
      This ensures §9.2 safety guards operate on real (confidence, correctness) pairs.
    affirmative_test_needed: >
      Add test: GPU mock implements TextCapableSampler; run_stage1_candidate with
      TextCapableSampler returns is_brier_from_real_pairs=True and does NOT fall to
      proxy fallback. This is partially covered by existing _MockTextCapableSampler
      tests (test_e0012.py line 1141) but the RUN SCRIPT path is not tested.

  - id: N-02
    severity: MINOR
    title: >
      determine_verdict() fires BUTTON_FOUND_BUT_UNSAFE even when adjudicator
      failed (passes=False) for accuracy/reliability safety conditions — over-aggressive
      vs §8 prereg "Stage 1 PASS but safety triggered"
    file: "src/cognitive_console/experiments/e0012_harness.py"
    line: 745
    evidence: >
      determine_verdict() (lines 744–758):
        unsafe_results = [r for r in stage1_results if r.safety.button_found_but_unsafe]
        if unsafe_results and not any(r.passes for r in stage1_results):
            → BUTTON_FOUND_BUT_UNSAFE

      r.passes = (adjudicator_passes AND NOT safety.button_found_but_unsafe).
      r.safety.button_found_but_unsafe can be True even when adjudicator failed
      (e.g., accuracy drop triggers safety, but 1-Brier improvement δ < 0.05 fails adjudicator).

      Independently confirmed: if ONE candidate fails adjudicator AND triggers accuracy guard,
      determine_verdict returns BUTTON_FOUND_BUT_UNSAFE (not NO_BUTTON_FOUND).

      Prereg §8 table: BUTTON_FOUND_BUT_UNSAFE = "Stage 1 PASS but ANY of the following
      safety conditions triggered." The cross-axis operational rule explicitly says
      "regardless of primary calibration adjudication result," but accuracy and reliability
      guards are listed under the "Stage 1 PASS but" header, implying adjudicator must pass.

      Impact direction: conservative (BUTTON_FOUND_BUT_UNSAFE is more cautious than
      NO_BUTTON_FOUND — doesn't falsely confirm a button). However, it misclassifies a
      fail-adjudicator candidate as "found but unsafe" for reporting purposes.
      Practical likelihood on GPU: low (accuracy drop severe enough to fail safety usually
      also fails 1-Brier improvement criterion — but NOT guaranteed).
    minimum_fix: >
      In determine_verdict(), restrict accuracy/reliability safety BUTTON_FOUND_BUT_UNSAFE
      to cases where the adjudicator also passed (or nearly passed). Simplest: check if
      any candidate had adjudicator_passes=True before applying the verdict:
        adj_pass_results = [r for r in stage1_results
                            if r.final_verdict == VERDICT_BUTTON_FOUND_BUT_UNSAFE
                            or (r.passes or r.final_verdict == 'PASS')]
      Alternatively, keep a separate flag for "adjudicator passed" vs "safety ok."
      Cross-axis fail should remain unconditional per prereg §9.4 operational rule.

