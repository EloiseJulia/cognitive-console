verdict: NEEDS-FIX

mandatory_before_gpu_boot:
  - "H-01 (BLOCKER): Fix kill-rule button score to use k=5 DEV re-evaluation, not k=3 Stage 0 score."
  - "H-02 (MAJOR): Fix Stage 1 Brier decomposition to use actual (confidence, correctness) pairs on GPU path; add GPU implementation plan to _eval_items_with_raw_pairs."
  - "H-03 (MAJOR): Replace hardcoded baseline_degen=0.1 with measured baseline from actual unsteered DEV runs."
  - "H-04 (MAJOR): Parameterize Stage 1 Bonferroni CI level as 1 - 0.05/M where M = len(advancing_candidates)."

recommended_before_gpu_boot:
  - "H-05 (MINOR): Add coherence_ratio to Stage0Candidate; use it in tie-breaking."
  - "H-06 (MINOR): Document or implement real-backend raw pair recording path."

independent_judgment_on_false_positive_risk: >
  The core architectural claims are sound:
  - BTN-CAL-PROBE genuinely does not use behavioral outcome labels (verbal confidence
    templates only). Non-trained boundary is intact.
  - BTN-CAL-CONTRA pair selection is deterministic and pre-committed; no direction
    optimization occurs.
  - Stage 0 selects among pre-specified directions by DEV performance (direction
    selection, not direction training). The F-02 architectural distinction is correctly
    implemented.
  - The frozen adjudicator (cluster_bootstrap_ci + axis_pass) is called without
    modification, with B=10000 and δ=0.05.

  However, the harness CANNOT produce fully credible results in its current state:
  - H-01 (kill rule k-asymmetry) directly undermines the primary anti-false-positive
    mechanism. A k=3-noisy button score being compared against k=5 auto-prompt is
    asymmetric enough to change the kill-rule outcome, especially on small DEV pools
    (~26 items). Any VERIFIED-CONTROL result produced without fixing H-01 is
    formally uninterpretable.
  - H-02 (Brier proxy) means the §9.2 safety guards (reliability worsening, gaming
    test) are evaluated on incorrect decomposition inputs. A genuine gaming pathway
    (button improves 1-Brier by sacrificing calibration reliability) could slip past
    the BUTTON_FOUND_BUT_UNSAFE gate.
  - H-04 (over-corrected Bonferroni) means a genuine single-candidate Stage 1 PASS
    at the pre-registered threshold (CI excludes 0 at α=0.05/1) could incorrectly
    return FAIL at the stricter α=0.05/3. This is anti-false-positive (safe direction)
    but inconsistent with the pre-registered specification.

  Fix H-01, H-02, H-03, H-04 first, then the harness has a credible design and
  can be trusted to produce honest results.

